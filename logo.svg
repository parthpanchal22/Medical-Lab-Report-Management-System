<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Flat Clinical Logo - No Glowing Gradients, Clear & Professional -->
  
  <!-- Calming Teal circular background plate with soft opacity -->
  <circle cx="50" cy="50" r="46" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1.5" />
  
  <!-- Diagnostic beaker outline in solid dark slate -->
  <path d="M38,25 L45,25 L45,35 L28,68 C25,74 29,81 37,81 L63,81 C71,81 75,74 72,68 L55,35 L55,25 L62,25" 
        fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Liquid level in solid clean clinical teal -->
  <path d="M32.5,60 L67.5,60 C69.5,64 68.8,70 65,74 C62,77 57,78 50,78 C43,78 38,77 35,74 C31.2,70 30.5,64 32.5,60 Z" 
        fill="#0d9488" />
  
  <!-- Clean medical cross overlay in beaker center -->
  <g transform="translate(50, 64)">
    <!-- White cross background for contrast -->
    <path d="M-3,-11 L3,-11 L3,-3 L11,-3 L11,3 L3,3 L3,11 L-3,11 L-3,3 L-11,3 L-11,-3 L-3,-3 Z" 
          fill="#ffffff" />
  </g>

  <!-- Clean outer tech accent lines representing pathology slides (very subtle, thin grey) -->
  <line x1="45" y1="20" x2="55" y2="20" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
</svg>
